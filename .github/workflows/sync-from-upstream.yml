name: Sync from upstream

on:
  # Fires on its own so a merged Store PR reaches this mirror without anyone
  # remembering to trigger it. The dispatch sender on the fork is the fast path
  # when it works; this schedule is the backstop for when it doesn't — which was
  # the actual history here (one manual run in five months, so the mirror silently
  # drifted and every ship session had to reconcile it by hand).
  #
  # Daily is the right cadence: a Store review takes days, and the sync is a no-op
  # when there is nothing new, so a tighter schedule buys nothing.
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily — off the hour to avoid GitHub's peak-minute queue
  repository_dispatch:
    types: [upstream-sync]
  workflow_dispatch:
    inputs:
      ext_dir:
        description: "Override monorepo directory name (extensions/<ext_dir>) if it differs from package.json name"
        required: false

# Set UPSTREAM_EXT_DIR in repo-level env vars to permanently override the
# monorepo directory name when it differs from the package.json name field.
# e.g. for chrismessina/raycast-reader: UPSTREAM_EXT_DIR = reader-mode
env:
  UPSTREAM_EXT_DIR: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read extension name from package.json
        id: meta
        run: |
          NAME=$(jq -r '.name' package.json)
          # Use override if provided (dispatch payload > workflow input > env var > package.json name)
          OVERRIDE="${{ github.event.client_payload.ext_name }}"
          if [ -z "$OVERRIDE" ]; then OVERRIDE="${{ inputs.ext_dir }}"; fi
          if [ -z "$OVERRIDE" ]; then OVERRIDE="${UPSTREAM_EXT_DIR}"; fi
          if [ -n "$OVERRIDE" ]; then NAME="$OVERRIDE"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download extension files from upstream monorepo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT_NAME="${{ steps.meta.outputs.name }}"
          API_BASE="https://api.github.com/repos/raycast/extensions/contents/extensions/${EXT_NAME}"

          # Recursively download all files in the extension directory
          download_dir() {
            local api_path="$1"
            local local_path="$2"

            items=$(gh api "$api_path" 2>/dev/null) || {
              echo "Failed to fetch $api_path"
              exit 1
            }

            echo "$items" | jq -c '.[]' | while read -r item; do
              type=$(echo "$item" | jq -r '.type')
              name=$(echo "$item" | jq -r '.name')
              download_url=$(echo "$item" | jq -r '.download_url // empty')
              subpath=$(echo "$item" | jq -r '.path' | sed "s|extensions/${EXT_NAME}/||")

              if [ "$type" = "file" ] && [ -n "$download_url" ]; then
                mkdir -p "$(dirname "$local_path/$name")"
                curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$download_url" -o "$local_path/$name"
                # Record what we wrote so the commit step can stage exactly these
                # paths. Staging the whole tree would sweep in local-only work.
                #
                # `subpath` is ALREADY the full repo-relative path of this file — the API
                # `path` with the `extensions/<ext>/` prefix stripped. Appending `$name` to
                # it doubles the last component ("package.json/package.json"), and a manifest
                # of paths that match nothing tracked makes the deletion loop below treat
                # EVERY tracked file as "no longer served upstream". That wiped this mirror
                # down to four directories on 2026-07-31, including this workflow.
                printf '%s\n' "$subpath" >> "$RUNNER_TEMP/synced-files.txt"
                echo "  downloaded: $subpath"
              elif [ "$type" = "dir" ]; then
                mkdir -p "$local_path/$name"
                download_dir "$api_path/$name" "$local_path/$name"
              fi
            done
          }

          download_dir "$API_BASE" "."

      - name: Commit and push if changed
        # Explicit bash: the deletion loop uses process substitution.
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the files this run downloaded. `git add -A` would also commit
          # anything else in the tree — an uncommitted local edit, an untracked
          # CLAUDE.md, a scratch file — into an automated commit nobody reviews.
          MANIFEST="$RUNNER_TEMP/synced-files.txt"
          if [ ! -s "$MANIFEST" ]; then
            echo "No files were downloaded; nothing to stage."
            exit 0
          fi
          sort -u "$MANIFEST" -o "$MANIFEST"
          tr '\n' '\0' < "$MANIFEST" | xargs -0 git add --

          # Propagate upstream deletions, but only for files that were ALREADY
          # tracked and sit under a directory this sync populates. A tracked file
          # outside those directories (AGENTS.md, CONCEPTS.md, .github/) is
          # local-only by design and must survive.
          # Note the process substitution: piping `git ls-files` into the loop would
          # run it in a subshell, where `git rm` still works but the intent is easy
          # to break later. Reading from `< <(...)` keeps it in the current shell.
          # Never consider paths this sync does not own, whatever the manifest says.
          # `.github/` in particular holds THIS workflow: a manifest bug once made the
          # loop delete it along with package.json and the README.
          SYNCED_ROOTS=$(cut -d/ -f1 "$MANIFEST" | sort -u | grep -v '^\.github$')
          CANDIDATES=$(git ls-files -- $SYNCED_ROOTS | grep -v '^\.github/' || true)

          # Refuse to mass-delete. A partial download — a rate limit mid-recursion, a
          # malformed manifest — looks exactly like "upstream removed everything", and
          # the deletion loop cannot tell the difference. Bail instead of guessing.
          TOTAL=$(printf '%s\n' "$CANDIDATES" | grep -c . || true)
          DOOMED=0
          while read -r tracked; do
            [ -n "$tracked" ] || continue
            grep -Fxq "$tracked" "$MANIFEST" || DOOMED=$((DOOMED + 1))
          done <<< "$CANDIDATES"
          if [ "$TOTAL" -gt 0 ] && [ "$DOOMED" -gt $((TOTAL / 2)) ]; then
            echo "ABORT: sync would delete $DOOMED of $TOTAL tracked files."
            echo "That is a failed or partial download, not an upstream removal."
            exit 1
          fi

          while read -r tracked; do
            [ -n "$tracked" ] || continue
            if ! grep -Fxq "$tracked" "$MANIFEST"; then
              echo "  upstream no longer serves: $tracked"
              git rm -q --cached --ignore-unmatch -- "$tracked"
              rm -f -- "$tracked"
            fi
          done <<< "$CANDIDATES"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            PR_NUMBER="${{ github.event.client_payload.pr_number }}"
            PR_URL="${{ github.event.client_payload.pr_url }}"
            MSG="chore: sync from upstream raycast/extensions"
            if [ -n "$PR_NUMBER" ]; then
              MSG="$MSG (raycast/extensions#${PR_NUMBER})"
            fi
            git commit -m "$MSG"
            git push
          fi
